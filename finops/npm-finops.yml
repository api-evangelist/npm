tags:
  - Packages
  - JavaScript
  - Node.js
  - Package Management
  - Registry
  - Security
  - FinOps
  - Cost Management
  - FOCUS
description: 'FOCUS-aligned FinOps for npm: the public registry is free; commercial spend is on GitHub
  seats and Packages storage/egress, billed per user per month with usage overages.'
sources:
  - https://github.com/pricing
  - https://docs.github.com/en/billing
  - https://www.npmjs.com/products
principles:
  - name: Visibility
    description: Use the GitHub billing dashboard and Billing Platform API to see per-org Packages storage,
      data transfer, and Actions minutes. Public registry consumption is free and not metered.
  - name: Allocation
    description: Tag spend by GitHub organization and team; private npm packages roll up under the publishing
      org's GitHub Packages line items.
  - name: Optimization
    description: Use the public npm registry for OSS dependencies (zero cost). Mirror or proxy via Verdaccio/JFrog
      for high-volume bulk reads. Use replicate.npmjs.com instead of scraping for indexing workloads.
  - name: Accountability
    description: Org admins manage seats and Packages overage policies. Set Actions/Packages spending
      limits and alerts in GitHub billing settings; reconcile monthly invoices against per-team chargeback.
billingModel:
  pricingCategory: Subscription + Usage
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Credit
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: npm
  ServiceCategory: Developer Tools / Package Registry
  ProviderName: npm
  PublisherName: GitHub, Inc.
  InvoiceIssuerName: GitHub, Inc.
  PricingCategory: Subscription + Usage
  PricingUnit: seat
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: github_seats
    description: Per-user GitHub plan seat (Team or Enterprise) granting private npm package access
    unit: seat
    aggregation: sum
    dimensions:
      - plan
      - org
  - name: packages_storage
    description: GitHub Packages storage consumed by private npm packages
    unit: GB-month
    aggregation: avg
    dimensions:
      - org
      - visibility
  - name: packages_data_transfer
    description: Outbound data transfer from the GitHub Packages registry
    unit: GB
    aggregation: sum
    dimensions:
      - org
  - name: actions_minutes
    description: GitHub Actions minutes consumed by npm publish/CI workflows
    unit: minute
    aggregation: sum
    dimensions:
      - runner_os
      - org
apis:
  - name: npm Registry API
    baseURL: https://registry.npmjs.org
