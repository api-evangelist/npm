apis:
- aid: npm:registry
  name: npm Registry API
  description: >-
    The npm Registry API provides programmatic access to the npm package registry, the largest software
    registry in the world hosting over two million JavaScript packages. Developers can query package metadata,
    download tarballs, search for packages, and retrieve version-specific information. The API follows
    CouchDB-based conventions and serves package manifests in JSON format, enabling tools and services
    to integrate with the npm ecosystem for dependency resolution, package discovery, and automated workflows.
  humanURL: https://github.com/npm/registry/blob/main/docs/REGISTRY-API.md
  baseURL: https://registry.npmjs.org
  tags:
  - Packages
  - JavaScript
  - Registry
  - Package Management
  - Node.js
  properties:
  - type: Documentation
    url: https://github.com/npm/registry/blob/main/docs/REGISTRY-API.md
  - type: OpenAPI
    url: openapi/npm-registry-api-openapi.yml
  - type: JSONSchema
    url: json-schema/npm-package-schema.json
- aid: npm:hooks
  name: npm Hooks API
  description: >-
    The npm Hooks API allows developers to subscribe to notifications about changes in the npm registry.
    Hooks send HTTP POST payloads to a configured URI whenever a package is changed, enabling developers
    to build integrations that respond to registry events in real time. Users can add hooks to follow
    specific packages, track all activity of given npm users, or monitor all packages within an organization
    or user scope. The API provides endpoints for creating, listing, updating, and deleting hook subscriptions.
  humanURL: https://blog.npmjs.org/post/145260155635/introducing-hooks-get-notifications-of-npm
  tags:
  - Webhooks
  - Notifications
  - Events
  - Automation
  - Packages
  properties:
  - type: Documentation
    url: https://blog.npmjs.org/post/145260155635/introducing-hooks-get-notifications-of-npm
  - type: OpenAPI
    url: openapi/npm-hooks-api-openapi.yml
  - type: AsyncAPI
    url: asyncapi/npm-hooks-asyncapi.yml
  - type: JSONSchema
    url: json-schema/npm-hook-event-schema.json
- aid: npm:cli
  name: npm CLI
  description: >-
    The npm CLI is the official command-line interface for the npm package manager, providing developers
    with tools to install, publish, and manage JavaScript packages and their dependencies. It supports
    package publishing with provenance attestation via Sigstore, workspace management for monorepos, script
    execution, semantic versioning, and comprehensive dependency tree management. The CLI is bundled with
    Node.js and serves as the primary developer interface for interacting with the npm registry.
  humanURL: https://docs.npmjs.com/cli
  tags:
  - Command Line
  - Package Management
  - JavaScript
  - Node.js
  - Developer Tools
  properties:
  - type: Documentation
    url: https://docs.npmjs.com/cli
  - type: SourceCode
    url: https://github.com/npm/cli
- aid: npm:provenance
  name: npm Provenance
  description: >-
    npm Provenance provides supply chain security for JavaScript packages by establishing a verifiable
    link between a published package and its source code repository and build environment. When a package
    is published with provenance, it is signed using Sigstore public good servers and the attestation
    is logged in a public transparency ledger. This allows developers to verify where and how a package
    was built before downloading it, helping to protect against supply chain attacks and ensuring the
    integrity of the npm ecosystem.
  humanURL: https://docs.npmjs.com/generating-provenance-statements
  tags:
  - Security
  - Supply Chain
  - Verification
  - Sigstore
  - Transparency
  - CI/CD
  properties:
  - type: Documentation
    url: https://docs.npmjs.com/generating-provenance-statements
  - type: Documentation
    url: https://github.blog/security/supply-chain-security/introducing-npm-package-provenance/
